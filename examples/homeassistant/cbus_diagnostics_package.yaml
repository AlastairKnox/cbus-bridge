# MQTT diagnostics package. Validate HA configuration before applying changes.
mqtt:
  sensor:
  - state_topic: cbus/bridge/status/diagnostics
    availability_topic: cbus/bridge/availability
    expire_after: 30
    entity_category: diagnostic
    device: &id001
      identifiers:
      - cbus_bridge_diagnostics
      name: C-Bus Bridge Diagnostics
    name: RX token rate
    unique_id: cbus_diag_rx_rate
    default_entity_id: sensor.cbus_diag_rx_rate
    value_template: '{{ value_json.diagnostics.rx_tokens_per_second_60s }}'
    unit_of_measurement: tokens/s
    state_class: measurement
  - state_topic: cbus/bridge/status/diagnostics
    availability_topic: cbus/bridge/availability
    expire_after: 30
    entity_category: diagnostic
    device: *id001
    name: TX frame rate
    unique_id: cbus_diag_tx_rate
    default_entity_id: sensor.cbus_diag_tx_rate
    value_template: '{{ value_json.diagnostics.tx_frames_per_second_60s }}'
    unit_of_measurement: frames/s
    state_class: measurement
  - state_topic: cbus/bridge/status/diagnostics
    availability_topic: cbus/bridge/availability
    expire_after: 30
    entity_category: diagnostic
    device: *id001
    name: RX tokens
    unique_id: cbus_diag_cni_rx_tokens_total
    default_entity_id: sensor.cbus_diag_cni_rx_tokens_total
    value_template: '{{ value_json.diagnostics.counters.get(''cni_rx_tokens_total'',
      0) }}'
    state_class: total_increasing
  - state_topic: cbus/bridge/status/diagnostics
